plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.sanya.assistant'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sanya.assistant'
        minSdk 26
        targetSdk 28   // 28 (not 29+) so Wi-Fi can be switched directly
        versionCode 7
        versionName '7.0'
        ndk { abiFilters 'arm64-v8a' }   // llama.cpp is only practical on 64-bit ARM
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -DNDEBUG"
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-26"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        debug {
            if (file('sanya.keystore').exists()) {
                storeFile file('sanya.keystore')
                storePassword System.getenv('SANYA_KEYSTORE_PASSWORD') ?: 'sanya1234'
                keyAlias 'sanya'
                keyPassword System.getenv('SANYA_KEY_PASSWORD') ?: 'sanya1234'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}
dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'

    // ---------------------------------------------------------------
    // Natural voice (Piper TTS via sherpa-onnx)
    //
    // sherpa-onnx is NOT on JitPack or Maven Central.
    // It ships as a pre-built AAR on GitHub Releases.
    //
    // TO ENABLE NATURAL VOICE:
    //   1. Download the AAR from GitHub:
    //      https://github.com/k2-fsa/sherpa-onnx/releases
    //      Look for: sherpa-onnx-v<latest>-android.tar.bz2
    //      Extract and copy sherpa-onnx-android.aar into app/libs/
    //
    //   2. Uncomment the two lines below:
    //
    // implementation fileTree(dir: 'libs', include: ['*.aar'])
    // implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'
    //
    // Until then, NaturalVoice.kt compiles fine (it uses reflection)
    // and falls back to Android's built-in TTS automatically.
    // ---------------------------------------------------------------
}
