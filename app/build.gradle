plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sanya.assistant'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sanya.assistant'
        minSdk 26
        targetSdk 28

        versionCode 7
        versionName '7.0'

        // llama.cpp native library target
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"

                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-26"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    signingConfigs {
        debug {
            if (file('sanya.keystore').exists()) {
                storeFile file('sanya.keystore')
                storePassword System.getenv('SANYA_KEYSTORE_PASSWORD') ?: 'sanya1234'
                keyAlias 'sanya'
                keyPassword System.getenv('SANYA_KEY_PASSWORD') ?: 'sanya1234'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            pickFirsts += ['lib/arm64-v8a/libc++_shared.so']
        }
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Natural voice using Sherpa-ONNX
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'

    // Read .tar.bz2 voice packs
    implementation 'org.apache.commons:commons-compress:1.26.1'
}
