name: Build APK
on: [push, workflow_dispatch]

env:
  # llama.cpp's API changes often. After one green build, copy the commit hash that the
  # "Get llama.cpp" step prints into this line, so later builds always use that version.
  # Leave it empty to build against the latest master.
  LLAMA_CPP_SHA: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get llama.cpp
        run: |
          D=app/src/main/cpp/llama.cpp
          if [ ! -f "$D/CMakeLists.txt" ]; then
            rm -rf "$D"
            mkdir -p "$D"
            if [ -n "$LLAMA_CPP_SHA" ]; then
              git -C "$D" init -q
              git -C "$D" remote add origin https://github.com/ggml-org/llama.cpp
              git -C "$D" fetch --depth 1 origin "$LLAMA_CPP_SHA"
              git -C "$D" checkout -q FETCH_HEAD
            else
              git clone --depth 1 https://github.com/ggml-org/llama.cpp "$D"
            fi
          fi
          echo "llama.cpp commit:"
          git -C "$D" log -1 --format=%H 2>/dev/null || true
          grep -n -A5 "llama_sampler_init_penalties" "$D/include/llama.h" || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - run: base64 -d app/sanya.keystore.b64 > app/sanya.keystore

      - run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Sanya-apk
          path: app/build/outputs/apk/debug/app-debug.apk
